name: IndexNow ping (after deploy)

# Pings IndexNow API with the top WC pages + latest news pages so Bing/Yandex
# crawl them within minutes (Google ignores IndexNow but is faster via Search
# Console — see EDITORIAL/roles/SEO_OPTIMISEUR.md).

on:
  workflow_run:
    workflows: ["News sync (fraîcheur et but confirmé)", "CR7 stats sync (daily)"]
    types: [completed]
  workflow_dispatch:

jobs:
  ping:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping IndexNow
        run: |
          curl -sS -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json' \
            -d '{
              "host": "to1000.com",
              "key": "f8f82a07b7534f4abc736cd183ff3cf4",
              "keyLocation": "https://to1000.com/f8f82a07b7534f4abc736cd183ff3cf4.txt",
              "urlList": [
                "https://to1000.com/",
                "https://to1000.com/obrigado-cristiano/",
                "https://to1000.com/coupe-du-monde/",
                "https://to1000.com/coupe-du-monde/equipe/maroc/",
                "https://to1000.com/coupe-du-monde/equipe/portugal/",
                "https://to1000.com/goals.html",
                "https://to1000.com/news/",
                "https://to1000.com/blog/"
              ]
            }' && echo "" && echo "✅ IndexNow pinged"
