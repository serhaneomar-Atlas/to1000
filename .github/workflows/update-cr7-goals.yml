name: 🔄 Update CR7 Goal Count

# ─── TRIGGERS ──────────────────────────────────────────────────────────────
# Quasi temps réel pendant les fenêtres de match : update_stats_v2.sync_goals
# crédite les nouveaux buts CR7 détectés sur ESPN (ledger anti-doublon dans
# stats.json). Fix 2026-07-01 : ce workflow lançait encore l'ancien
# update_stats.py (API-Football, abandonné) — le compteur ne bougeait jamais.
on:
  schedule:
    # Every 5 min, 16:00–23:00 UTC  (Saudi matches ~19:00–22:00 AST)
    - cron: '*/5 16-23 * * 0,2-6'
    # Every 5 min, 17:00–23:00 UTC  (Portugal / European nights, WC 2026)
    - cron: '*/5 17-23 * * 1-4'
    # Nightly full stats refresh at 02:00 UTC
    - cron: '0 2 * * *'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      force_goals:
        description: 'Override goal count manually (leave empty for API)'
        required: false
        default: ''

# ─── PERMISSIONS ───────────────────────────────────────────────────────────
permissions:
  contents: write

# Un seul run à la fois : évite les push concurrents avec soi-même.
# stats-sync.yml (quotidien) garde son propre groupe mais pushe rarement au
# même instant ; le git pull --rebase ci-dessous absorbe le cas résiduel.
concurrency:
  group: update-cr7-goals
  cancel-in-progress: false

# ─── JOB ───────────────────────────────────────────────────────────────────
jobs:
  update-goals:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync CR7 goals & matches from ESPN
        env:
          FORCE_GOALS: ${{ github.event.inputs.force_goals }}
        run: python scripts/update_stats_v2.py

      - name: Commit if stats changed
        id: commit
        run: |
          git config user.name  "CR7 Stats Bot 🤖"
          git config user.email "bot@to1000.com"
          # update_stats_v2 resynchronise aussi les compteurs hardcodés du HTML
          git add public/stats.json 2>/dev/null || true
          git add public/index.html public/goals.html public/blog/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No change in goal count — skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            GOALS=$(python -c "import json; d=json.load(open('public/stats.json')); print(d['goals'])")
            git commit -m "⚽ CR7 at ${GOALS} goals — auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push
            echo "✅ Pushed updated stats.json — CR7 now at ${GOALS} goals"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public/ --project-name to1000 --branch main
