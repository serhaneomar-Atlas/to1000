name: News editorial (enrichissement Gemini, découplé)

# Le « cerveau » éditorial, séparé de la publication. news-sync publie vite
# (cache-only, zéro Gemini live → jamais de timeout). Ce workflow enrichit un
# petit lot d'articles via Gemini (rythmé, borné) et alimente le cache que
# news-sync réutilise (préservation par id). → publication fiable + qualité qui
# monte. Même groupe de concurrence que news-sync : ils ne tournent jamais
# en même temps (pas de course sur news.json).

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (repo public = minutes illimitées)
  workflow_dispatch:
  push:                       # re-enrichit dès qu'on change le prompt/le cerveau
    branches: [main]
    paths:
      - 'scripts/editorial.py'
      - 'scripts/enrich_news.py'
      - 'scripts/translator.py'
      - '.github/workflows/news-editorial.yml'

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (pour la régénération HTML)
        run: pip install feedparser

      - name: Snapshot news.json hash
        id: pre
        run: echo "hash=$(sha256sum public/news.json 2>/dev/null | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Enrichir un lot d'articles (rédacteur en chef Gemini, borné)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/enrich_news.py

      - name: Audit sémantique — le juge de fond relit source complet vs publié
        continue-on-error: true     # un juge en panne ne bloque pas la publication
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/audit_semantique.py

      - name: Régénérer les pages article + cartes (refléter l'enrichissement)
        continue-on-error: true
        run: |
          python scripts/news_to_html.py
          python scripts/prerender_news.py

      - name: Détecter un changement
        id: diff
        run: |
          NEW=$(sha256sum public/news.json | cut -d' ' -f1)
          if [ "${{ steps.pre.outputs.hash }}" = "$NEW" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "::notice::Aucun enrichissement ce run — skip commit/deploy"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        env:
          # Le rejeu post-conflit relance enrich_news : sans la clé il
          # sortirait « rien à faire » et le run serait vert sans travail.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "to1000-editorial-bot"
          git config user.email "to1000-editorial-bot@users.noreply.github.com"
          for f in public/news.json public/news.html public/translations_cache.json public/news/ EDITORIAL/state/semantic_audit.jsonl; do
            git add "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "::notice::Rien à committer"
            exit 0
          fi
          git commit -m "chore(editorial): enrichissement Gemini [$(date -u +%Y-%m-%dT%H:%M)Z]"
          if bash scripts/ci_push.sh main; then
            exit 0
          fi
          # Course structurelle observée le 21/08 : l'enrichissement dure 10-20
          # min et news-sync rafraîchit le fil pendant ce temps → rebase en
          # conflit sur news.json, travail perdu. Le remède est de repartir du
          # fil FRAIS et de rejouer l'enrichissement : toutes les décisions
          # sont dans le cache de traduction, la seconde passe coûte zéro
          # appel Gemini et quelques secondes.
          echo "::warning::conflit avec un refresh du fil — rejeu de l'enrichissement sur le fil frais (cache)"
          git fetch origin main && git reset --hard origin/main
          python scripts/enrich_news.py
          python scripts/audit_semantique.py || true
          python scripts/news_to_html.py || true
          python scripts/prerender_news.py || true
          for f in public/news.json public/news.html public/translations_cache.json public/news/ EDITORIAL/state/semantic_audit.jsonl; do
            git add "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "::notice::Rien à committer après rejeu"
            exit 0
          fi
          git commit -m "chore(editorial): enrichissement Gemini [$(date -u +%Y-%m-%dT%H:%M)Z] (rejeu post-refresh)"
          bash scripts/ci_push.sh main

      - name: Deploy to Cloudflare Pages
        if: steps.diff.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash scripts/prune_deploy_assets.sh
          npx wrangler@latest pages deploy public/ --project-name to1000 --branch main --commit-dirty=true
