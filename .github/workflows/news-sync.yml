name: News sync (toutes les 2 h)

# Why: aggrège les news foot/CR7, rafraîchit news.json, et déploie sur Cloudflare
# quand le contenu change. Fréquence réduite à 2 h pour rester sous les 2000 min
# Actions gratuites (repo privé). Les étapes non-critiques sont continue-on-error :
# une news fraîche est TOUJOURS déployée même si une sous-étape échoue.

on:
  schedule:
    - cron: "0 * * * *"   # toutes les heures (repo public = minutes illimitées)
  workflow_dispatch:          # allow manual trigger from the Actions tab

# Allow the workflow to push the regenerated news.json back to the repo
permissions:
  contents: write

concurrency:
  group: news-sync
  cancel-in-progress: false   # don't kill a run mid-deploy

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Snapshot existing news.json hash
        id: pre
        run: |
          if [ -f public/news.json ]; then
            echo "hash=$(sha256sum public/news.json | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          else
            echo "hash=none" >> $GITHUB_OUTPUT
          fi

      - name: Run news aggregator (editorial summaries if GEMINI_API_KEY set)
        env:
          # Get a free key at https://aistudio.google.com/app/apikey
          # With it: one Gemini call per new item rewrites a concise, neutral
          # "essential" summary (no clickbait) + title in FR/EN/ES/AR.
          # Without it: graceful fallback to literal translation, then to the
          # source-language excerpt — the pipeline never breaks.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/news_aggregator.py

      - name: Generate SEO HTML pages for each news item
        continue-on-error: true
        run: python scripts/news_to_html.py

      - name: Archiver les vieux articles (>7j) — page /news/archive (SEO-safe)
        continue-on-error: true
        run: python scripts/archive_old_news.py

      - name: Prerender news cards into news.html (SEO — crawlable content)
        continue-on-error: true
        run: python scripts/prerender_news.py

      - name: GA4 credentials (optionnel — actif seulement si les secrets sont posés)
        continue-on-error: true
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
        run: |
          if [ -n "$GA4_PROPERTY_ID" ] && [ -n "$GA4_SA_JSON" ]; then
            pip install --quiet google-analytics-data
            printf '%s' "$GA4_SA_JSON" > "$RUNNER_TEMP/ga4-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4-sa.json" >> "$GITHUB_ENV"
            echo "::notice::GA4 configuré — le dashboard affichera le trafic réel."
          else
            echo "::notice::GA4 non configuré — dashboard en mode 'à connecter' (voir CONNECT_ANALYTICS.md)."
          fi

      - name: Collect dashboard metrics (auto-updating marketing dashboard)
        continue-on-error: true
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python scripts/collect_metrics.py

      - name: Update WC countdown JSON (morocco_next, portugal_next)
        continue-on-error: true
        run: python scripts/wc_countdown_update.py

      - name: Regenerate sitemap.xml
        continue-on-error: true
        run: python scripts/sitemap_generator.py

      - name: Detect content change
        id: diff
        run: |
          NEW_HASH=$(sha256sum public/news.json | cut -d' ' -f1)
          echo "hash=$NEW_HASH" >> $GITHUB_OUTPUT
          if [ "${{ steps.pre.outputs.hash }}" = "$NEW_HASH" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "::notice::news.json unchanged — skipping commit and deploy"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::notice::news.json changed — will commit and deploy"
          fi

      - name: Commit and push news.json + translation cache
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "to1000-news-bot"
          git config user.email "to1000-news-bot@users.noreply.github.com"
          git add public/news.json public/news.html public/translations_cache.json public/news/ public/wc.json public/sitemap.xml public/dashboard-data.json public/marketing_log.json scripts/metrics_history.json 2>/dev/null || true
          # Only commit if there are actually staged changes
          if git diff --cached --quiet; then
            echo "::notice::No staged changes to commit"
          else
            git commit -m "chore(news): refresh feed [$(date -u +%Y-%m-%dT%H:%M)Z]"
            git push
          fi

      # Optional deploy step — runs only when both:
      #   (a) news.json actually changed
      #   (b) the CLOUDFLARE_API_TOKEN secret is set in the repo
      # If your repo is already connected to Cloudflare Pages via Git integration,
      # the previous commit push will trigger the deploy automatically and this
      # step becomes a redundant no-op (still cheap, ~2s skip).
      - name: Deploy to Cloudflare Pages
        if: steps.diff.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy public/ \
            --project-name to1000 \
            --branch main \
            --commit-dirty=true
