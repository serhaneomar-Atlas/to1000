name: Deploy to Cloudflare Pages (on push)

# Why: any code/content push to main (e.g. a fix committed from a dev machine
# or an agent) should reach production WITHOUT a manual `wrangler` run.
# Data bots (news-sync / stats-sync / update-cr7-goals) already deploy themselves
# right after they push, so we skip their commits here to avoid a redundant
# double-deploy. This workflow exists for human/code commits.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      # Les générateurs exécutés ci-dessous : un changement de modèle doit
      # être redéployé même si aucun fichier public n'a bougé.
      - 'scripts/news_to_html.py'
      - 'scripts/prerender_news.py'
      - 'scripts/news_locale.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:   # allow manual "Deploy now" from the Actions tab

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true   # if two pushes land, only deploy the latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Skip commits authored by the data bots — they deploy themselves.
    # Skip ONLY when the push actor is a data bot (they deploy themselves).
    # We deliberately do NOT filter on commit messages: merge commits and mixed
    # pushes were silently skipping real code deploys. A redundant deploy is
    # cheap; a missed one is not.
    if: >-
      github.actor != 'to1000-news-bot' &&
      github.actor != 'to1000-stats-bot'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Régénérer les articles et cartes avec le contrat de langue courant
        # En cas d'échec, la fin du message part en annotation « ::error » :
        # lisible sans connexion (API check-runs), alors que le journal
        # complet exige d'être connecté à GitHub.
        run: |
          python3 --version
          run_step() {
            name="$1"; shift
            if ! "$@" > "/tmp/$name.log" 2>&1; then
              cat "/tmp/$name.log"
              msg=$(tail -c 1800 "/tmp/$name.log" | tr '\n' ' ' | tr -d '\r')
              echo "::error title=$name a échoué::$msg"
              exit 1
            fi
            cat "/tmp/$name.log"
          }
          run_step news_to_html python3 scripts/news_to_html.py
          run_step prerender python3 scripts/prerender_news.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set — cannot deploy."
            echo "Add it under: repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          bash scripts/prune_deploy_assets.sh
          npx wrangler@latest pages deploy public/ \
            --project-name to1000 \
            --branch main \
            --commit-dirty=true

